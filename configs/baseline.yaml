# FedMed Baseline Configuration (Week 1)
# Cross-silo brain tumor MRI segmentation baseline config

seed: 42

data:
  source: "synthetic"           # "synthetic", "decathlon", or "brats_local"
  root_dir: "data"
  task: "Task01_BrainTumour"
  download: false
  label_scheme: "auto"          # "auto", "msd", or "brats"
  label_maps:
    msd:
      tc: [2, 3]
      wt: [1, 2, 3]
      et: [2]
    brats:
      tc: [1, 4]
      wt: [1, 2, 4]
      et: [4]
  splits_path: "data/splits.json"
  metadata_path: "data/metadata.json"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  dataset_type: "cache"         # "cache", "persistent", or "plain"
  cache_rate: 1.0
  cache_dir: "data/cache"
  roi_size: [96, 96, 96]
  num_samples: 2
  pos: 1.0
  neg: 1.0
  spacing: [1.0, 1.0, 1.0]
  orientation: "RAS"
  batch_size: 2
  val_batch_size: 1
  test_batch_size: 1
  num_workers: 0
  pin_memory: false
  flip_prob: 0.5
  scale_intensity_factor: 0.1
  shift_intensity_offset: 0.1
  synthetic:
    num_patients: 10
    spatial_size: [64, 64, 64]

model:
  name: "monai_unet"            # "monai_unet", "segresnet", "dynunet", "unet3d_custom"
  in_channels: 4
  out_channels: 3
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  kernel_size: 3
  act: "PRELU"
  dropout: 0.1
  norm:
    type: "group"               # "group" or "instance"; "batch" is banned
    num_groups: 8
  init:
    name: "kaiming"             # "kaiming", "xavier", or "none"
  # DynUNet-specific
  deep_supervision: false
  deep_supr_num: 1
  # SegResNet-specific
  init_filters: 16
  blocks_down: [1, 2, 2, 4]
  blocks_up: [1, 1, 1]
  # Custom UNet-specific
  depth: 4
  base_channels: 16
  use_residual: true

loss:
  name: "dice_ce"               # "dice_ce", "dice_focal", "dice"
  lambda_dice: 1.0
  lambda_ce: 1.0
  lambda_focal: 1.0
  gamma: 2.0
  smooth_nr: 1.0e-5
  smooth_dr: 1.0e-5
  batch: true                   # Compute Dice over the batch dimension
  channel_weights: [1.0, 1.0, 1.0]   # Per-channel weights for TC, WT, ET

metrics:
  threshold: 0.5
  empty_policy: "brats"         # "brats" or "skip"
  hd95:
    enabled: true
    every_n_epochs: 5
  max_hd95: 373.13              # Diagonal of 240x240x155 BraTS volume in mm
  spacing: [1.0, 1.0, 1.0]

training:
  epochs: 5
  device: "auto"               # "auto", "cpu", or "cuda"
  optimizer:
    name: "adamw"              # "adamw", "sgd", or "adam"
    lr: 0.0002
    weight_decay: 0.00001
    betas: [0.9, 0.999]
    momentum: 0.9
    nesterov: false
  scheduler:
    name: "cosine"             # "cosine", "poly", or "none"
    warmup_epochs: 1
    min_lr: 1.0e-6
    poly_power: 1.0
  amp:
    enabled: true              # auto-disabled with a warning on CPU
    dtype: "float16"           # "float16" or "bfloat16"
  grad_clip:
    enabled: true
    max_norm: 1.0
  grad_accum_steps: 1
  val_every_n_epochs: 1
  sliding_window:
    roi_size: [96, 96, 96]
    sw_batch_size: 1
    overlap: 0.25
    mode: "gaussian"           # "gaussian" or "constant"
    progress: false
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.0001
    monitor: "val_dice_mean"
    mode: "max"
  checkpoint:
    dir: "checkpoints"
    save_every_n_epochs: 5
    keep_last_k: 3
    save_optimizer: true
  resume:
    enabled: false
    path: null                 # null, "auto", or explicit checkpoint path
  logging:
    run_name: "baseline"
    output_dir: "outputs/runs"
    tensorboard: true
    log_every_n_steps: 10
  deterministic:
    enabled: true
    cudnn_benchmark: false
  max_steps_per_epoch: null
  # Backwards compatibility keys
  lr: 0.0002
  weight_decay: 0.00001
  loss: "dice_ce"
  val_interval: 1
  save_dir: "checkpoints"

logging:
  log_file: "outputs/fedmed.log"
  level: "INFO"
  tensorboard_dir: "runs/baseline"

output:
  viz_path: "outputs/slice_montage.png"
