# FedMed Federated Learning Configuration: 3 Mock Hospital Nodes
# Distributed cross-silo setup for multi-center brain tumor MRI segmentation

seed: 42

server:
  address: "127.0.0.1:8080"
  num_rounds: 3
  min_fit_clients: 3
  min_eval_clients: 3
  min_available_clients: 3
  fraction_fit: 1.0
  fraction_eval: 1.0

federated:
  mode: "iid"                    # "iid" (equal balanced split) or "non_iid" (proportional split)
  proportions: [0.50, 0.30, 0.20] # used when mode is "non_iid"
  local_val_ratio: 0.20          # 20% of each hospital's data reserved for local validation
  global_val_ratio: 0.15         # 15% held out for server-side global evaluation
  manifest_path: "partitions/partition_manifest.json"

hospitals:
  - id: "hospital_1"
    name: "General Hospital Scribe"
    port: 8081
    local_epochs: 1
    lr: 0.0002
  - id: "hospital_2"
    name: "University Health Alliance"
    port: 8082
    local_epochs: 1
    lr: 0.0002
  - id: "hospital_3"
    name: "Memorial Cancer Institute"
    port: 8083
    local_epochs: 1
    lr: 0.0002

data:
  source: "synthetic"
  root_dir: "data"
  task: "Task01_BrainTumour"
  download: false
  label_scheme: "auto"
  label_maps:
    msd:
      tc: [2, 3]
      wt: [1, 2, 3]
      et: [2]
    brats:
      tc: [1, 4]
      wt: [1, 2, 4]
      et: [4]
  splits_path: "data/splits.json"
  metadata_path: "data/metadata.json"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  dataset_type: "cache"
  cache_rate: 1.0
  cache_dir: "data/cache"
  roi_size: [32, 32, 32]
  num_samples: 1
  pos: 1.0
  neg: 1.0
  spacing: [1.0, 1.0, 1.0]
  orientation: "RAS"
  batch_size: 2
  val_batch_size: 1
  test_batch_size: 1
  num_workers: 0
  pin_memory: false
  flip_prob: 0.5
  scale_intensity_factor: 0.1
  shift_intensity_offset: 0.1
  synthetic:
    num_patients: 12
    spatial_size: [32, 32, 32]

model:
  name: "monai_unet"
  in_channels: 4
  out_channels: 3
  channels: [16, 32, 64]
  strides: [2, 2]
  norm: "INSTANCE"
  dropout: 0.1

training:
  epochs: 1
  lr: 0.0002
  weight_decay: 0.00001
  loss: "dice_ce"
  val_interval: 1
  save_dir: "checkpoints/federated"
  device: "cpu"

logging:
  log_file: "outputs/fedmed_federated.log"
  level: "INFO"
  tensorboard_dir: "runs/federated"

output:
  viz_path: "outputs/slice_montage_fl.png"
